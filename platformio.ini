; M5Stack Spotify Desk Controller
;
; Two targets, one source tree:
;   native  -> SDL2 window on this Mac, for developing and debugging the UI
;   esp32   -> the real M5Stack Core Basic v2.7
;
; Build/run the emulator:   pio run -e native && .pio/build/native/program
; Flash the device:         pio run -e esp32 -t upload

[platformio]
default_envs = native

[env]
build_flags =
    -std=c++14
    -DAPP_NAME=\"m5-spotify\"
lib_deps =
    m5stack/M5Unified@^0.2.7
    bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; Native SDL build (Apple Silicon Homebrew at /opt/homebrew)
; ---------------------------------------------------------------------------
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DM5GFX_BOARD=board_M5Stack
    -DM5GFX_SCALE=2
    -DM5GFX_ROTATION=0
    -DEMULATOR=1
    -I${sysenv.HOMEBREW_PREFIX}/include
    -I${sysenv.HOMEBREW_PREFIX}/include/SDL2
    -L${sysenv.HOMEBREW_PREFIX}/lib
    -lSDL2
    -lcurl
    -g
build_src_filter =
    +<*>
    -<platform/esp32/>

; ---------------------------------------------------------------------------
; Real hardware: M5Stack Core Basic v2.7
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
; The Arduino ESP32 core appends -std=gnu++11, which wins over [env]'s
; -std=c++14. Command and PlaybackState use default member initialisers, which
; make a struct a non-aggregate in C++11, so brace-init of Command fails to
; compile. Unset theirs and set ours after it.
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++14
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000
build_src_filter =
    +<*>
    -<platform/native/>

; ---------------------------------------------------------------------------
; Host unit tests for the display-free logic.
;   pio test -e test
; No M5GFX and no SDL: everything under test is header-only and hardware-free,
; which is the point — it runs anywhere and in milliseconds.
; ---------------------------------------------------------------------------
[env:test]
platform = native
test_framework = unity
build_flags =
    -std=c++14
    -I src
build_src_filter = -<*>
lib_deps =
